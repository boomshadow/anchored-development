workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Auto-cancel pipelines superseded by a newer commit on the same branch.
default:
  interruptible: true

stages:
  - validate
  - build
  - drift-detection
  - guard

validate:spec-index:
  stage: validate
  image: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  before_script:
    - apk add --no-cache git
    - pip install -q 'pyyaml==6.0.3'
  script:
    - python3 .claude/skills/spec/scripts/generate_index.py
    - git diff --exit-code docs/specs/INDEX.md

validate:adr-index:
  stage: validate
  image: python:3.14.8-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  before_script:
    - apk add --no-cache git
    - pip install -q 'pyyaml==6.0.3'
  script:
    - python3 .claude/skills/adr/scripts/generate_index.py
    - git diff --exit-code docs/decisions/INDEX.md

build:smoke-test:
  stage: build
  image: node:24.16.0-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
  script:
    - npm ci
    - npm test

anchor-watch:
  stage: drift-detection
  image: registry.gitlab.com/boomshadow-public/anchor-watch-image:4.0.0@sha256:8affab042a0dfc84e34ea22c71c84c6834c50db5b4ce861ad203a9a06cbb3226
  script:
    - node .claude/agents/scripts/ci-drift-detector.mjs
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Enforces the versioning ritual (AGENTS.md § Versioning & releases): a change to
# the framework spec is a release, so it must bump the version. Runs only when
# SPEC-000 changed in an MR, and fails unless its version field changed in the same MR.
version-guard:
  stage: guard
  image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - |
      if git diff "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD -- docs/specs/SPEC-000-anchored-development.md | grep -q '^+version:'; then
        echo "OK: the SPEC-000 version was bumped."
      else
        echo "FAIL: SPEC-000 changed but its version field did not."
        echo "A framework change is a release — bump the SPEC-000 version, then tag and publish a GitHub release on merge."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/specs/SPEC-000-anchored-development.md
