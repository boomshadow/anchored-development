workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - build
  - drift-detection
  - guard

validate:spec-index:
  stage: validate
  image: python:3.14.6-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
  before_script:
    - apk add --no-cache git
    - pip install -q 'pyyaml==6.0.3'
  script:
    - python3 .claude/skills/spec/scripts/generate_index.py
    - git diff --exit-code docs/specs/INDEX.md

validate:adr-index:
  stage: validate
  image: python:3.14.6-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
  before_script:
    - apk add --no-cache git
    - pip install -q 'pyyaml==6.0.3'
  script:
    - python3 .claude/skills/adr/scripts/generate_index.py
    - git diff --exit-code docs/decisions/INDEX.md

build:smoke-test:
  stage: build
  image: node:24.16.0-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
  script:
    - npm ci
    - npm test

anchor-watch:
  stage: drift-detection
  image: registry.gitlab.com/boomshadow/anchor-watch-image:2.0.2@sha256:03f548c0d371400590837fdeb78284cfe8b2f8f6cd1a35f7ff0642e40b76395c
  script:
    - node .claude/agents/scripts/ci-drift-detector.mjs
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Enforces the versioning ritual (AGENTS.md § Versioning & releases): a change to
# the framework spec is a release, so it must carry a CHANGELOG.md entry. Runs only
# when SPEC-000 changed in an MR, and fails unless CHANGELOG.md changed in the same MR.
changelog-guard:
  stage: guard
  image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - |
      if git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD | grep -qx "CHANGELOG.md"; then
        echo "OK: CHANGELOG.md was updated alongside SPEC-000."
      else
        echo "FAIL: SPEC-000 changed but CHANGELOG.md was not updated in this MR."
        echo "A framework change is a release — add a CHANGELOG.md entry (and bump the SPEC-000 version, then tag on merge)."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/specs/SPEC-000-anchored-development.md
